<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avaliador Pessoal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}</style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-4">
      <header class="flex items-center justify-between py-4">
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <img src="img/logo.png" alt="Logo Avaliador" class="h-16 w-16 object-contain">
          <span>Avaliador Pessoal</span>
        </h1>
        <div class="flex items-center gap-2">
          <a id="signin-btn" href="login.html" class="bg-red-500 text-white px-4 py-2 rounded shadow inline-block">Entrar / sair</a>
          <button id="signout-btn" class="bg-gray-200 text-gray-800 px-3 py-2 rounded hidden">Sair</button>
        </div>
      </header>

      <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Form -->
        <section class="md:col-span-1 bg-white p-4 rounded shadow">
          <h2 class="font-semibold text-lg mb-3">Adicionar avaliação</h2>
          <form id="review-form" class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700">Tipo</label>
              <div class="mt-1 flex gap-2">
                <label class="inline-flex items-center"><input type="radio" name="kind" value="movie" checked class="mr-2">Filme</label>
                <label class="inline-flex items-center"><input type="radio" name="kind" value="series" class="mr-2">Série</label>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Título</label>
              <input id="title" type="text" required class="mt-1 block w-full border-gray-300 rounded px-3 py-2" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Gênero (digite)</label>
              <input id="genre" type="text" placeholder="Ex: Ação, Comédia" class="mt-1 block w-full border-gray-300 rounded px-3 py-2" />
            </div>

            <div id="season-wrapper" class="hidden">
              <label class="block text-sm font-medium text-gray-700">Temporada (séries)</label>
              <input id="season" type="number" min="1" class="mt-1 block w-full border-gray-300 rounded px-3 py-2" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Nota</label>
              <select id="rating" class="mt-1 block w-full border-gray-300 rounded px-3 py-2">
                <option value="1">★</option>
                <option value="2">★★</option>
                <option value="3">★★★</option>
                <option value="4">★★★★</option>
                <option value="5" selected>★★★★★</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Opinião</label>
              <textarea id="opinion" rows="3" class="mt-1 block w-full border-gray-300 rounded px-3 py-2"></textarea>
            </div>

            <div class="flex gap-2">
              <button id="submit-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Salvar</button>
              <button id="cancel-edit-btn" type="button" class="hidden bg-gray-200 px-3 py-2 rounded">Cancelar edição</button>
            </div>
            <div id="form-message" class="text-sm mt-2"></div>
          </form>
        </section>

        <!-- List -->
        <section class="md:col-span-2 bg-white p-4 rounded shadow">
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-semibold text-lg">Avaliações</h2>
            <div class="text-sm text-gray-600"></div>
          </div>

          <div id="reviews-list" class="space-y-3"></div>
        </section>
      </main>

      <footer class="text-center py-4">
        <p class="text-sm"> &copy; Fatec Itu</p>
    </footer>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
